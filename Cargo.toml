[package]
name = "gfx_bouncing_ball"
version = "0.1.0"
edition = "2021"

[dependencies]
gilrs = "0.10"
#rusttype = "0.9"
#sdl2 = "0.38.0"
#sdl2 = { version = "0.38.0", features = ["static-link", "image", "ttf"] }

[dependencies.sdl2]
version = "0.38.0"
default-features = false
#features = ["ttf", "image", "mixer", "gfx", "static-link", "use-vcpkg"]
features = ["ttf", "image", "mixer", "gfx"]

[target.'cfg(any(target_os = "linux"))'.dependencies]
sdl2 = { version = "0.38.0", features = ["use-pkgconfig"] }

# macOS, prefer system SDL2 libraries
#[target.'cfg(target_os = "macos")'.dependencies]
#sdl2 = { version = "0.38.0", features = ["static-link"] }

# Windows native builds → system SDL2 (expect SDL2/SDL2_ttf installed)
[target.'cfg(all(target_os = "windows"))'.dependencies]
sdl2 = { version = "0.38.0", default-features = false, features = ["bundled"] }

[workspace.metadata.cross.target.aarch64-unknown-linux-gnu]
# Install libssl-dev:arm64, see <https://github.com/cross-rs/cross/blob/main/docs/custom_images.md#adding-dependencies-to-existing-images>
pre-build = [
  "dpkg --add-architecture $CROSS_DEB_ARCH",
  "apt-get update",
  "apt-get --assume-yes install libsdl2-dev:$CROSS_DEB_ARCH libsdl2-ttf-dev:$CROSS_DEB_ARCH libsdl2-image-dev:$CROSS_DEB_ARCH libsdl2-mixer-dev:$CROSS_DEB_ARCH libsdl2-gfx-dev:$CROSS_DEB_ARCH"
]

[workspace.metadata.cross.target.x86_64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture $CROSS_DEB_ARCH",
  "apt-get update",
  "apt-get --assume-yes install libsdl2-dev:$CROSS_DEB_ARCH libsdl2-ttf-dev:$CROSS_DEB_ARCH libsdl2-image-dev:$CROSS_DEB_ARCH libsdl2-mixer-dev:$CROSS_DEB_ARCH libsdl2-gfx-dev:$CROSS_DEB_ARCH"
]

[workspace.metadata.cross.target.riscv64gc-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture $CROSS_DEB_ARCH",
  "apt-get update",
  "apt-get --assume-yes install libsdl2-dev:$CROSS_DEB_ARCH libsdl2-ttf-dev:$CROSS_DEB_ARCH libsdl2-image-dev:$CROSS_DEB_ARCH libsdl2-mixer-dev:$CROSS_DEB_ARCH libsdl2-gfx-dev:$CROSS_DEB_ARCH"
]

[workspace.metadata.cross.target.x86_64-pc-windows-gnu]
pre-build = [
  "apt-get update && apt-get --assume-yes install mingw-w64 libsdl2-dev libsdl2-tff-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-gfx-dev"
]
